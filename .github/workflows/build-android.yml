name: Android-App bauen # Läuft automatisch bei jedem Push, und lässt sich zusätzlich manuell # über den Reiter "Actions" auf GitHub starten ("Run workflow"). on: push: branches: [main] workflow_dispatch: {} jobs: build: runs-on: ubuntu-latest steps: - name: Code auschecken uses: actions/checkout@v4 - name: Java einrichten uses: actions/setup-java@v4 with: distribution: 'temurin' java-version: '21' # Hinweis: GitHub-Rechner (ubuntu-latest) haben bereits ein aktuelles # Android-SDK vorinstalliert (ANDROID_HOME ist schon gesetzt) – wir # müssen nur noch die Lizenzen bestätigen, kein separates Setup nötig. - name: Android-SDK-Lizenzen akzeptieren run: yes | sdkmanager --licenses || true - name: Node einrichten uses: actions/setup-node@v4 with: node-version: '22' - name: Abhängigkeiten installieren run: npm install - name: Capacitor-Android-Projekt synchronisieren run: npx cap sync android # Hinweis: Beim Hochladen über Web/Desktop-Oberflächen verliert die # gradlew-Datei manchmal ihr Ausführungsrecht - hier wird es wiederhergestellt. - name: Gradle ausführbar machen run: chmod +x android/gradlew - name: APK bauen (Debug – direkt installierbar, ohne eigene Signatur) working-directory: android run: ./gradlew assembleDebug --no-daemon - name: APK als Download bereitstellen uses: actions/upload-artifact@v4 with: name: Fahrtenplan-App path: android/app/build/outputs/apk/debug/app-debug.apk
