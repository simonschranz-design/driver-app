name: Android-App bauen

# Läuft automatisch bei jedem Push, und lässt sich zusätzlich manuell
# über den Reiter "Actions" auf GitHub starten ("Run workflow").
#
# Ergebnis (unten im Lauf bei "Artifacts"):
#   - Fahrtenplan-Test-APK      → fahrtenplanV4-test.apk, direkt aufs Handy installierbar (App «Fahrtenplan Test»)
#   - Fahrtenplan-PlayStore     → .aab-Datei zum Hochladen in die Google Play Console
#                                 (nur wenn die Secrets FP_UPLOAD_KEYSTORE_BASE64 und FP_KEYSTORE_PASSWORD
#                                  unter Settings → Secrets → Actions hinterlegt sind; FP_KEY_ALIAS wird nicht mehr gebraucht)
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEY: ${{ secrets.FP_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # GitHub-Rechner (ubuntu-latest) haben bereits ein Android-SDK vorinstalliert –
      # nur die Lizenzen bestätigen und die für Android 16 (API 36) nötigen Teile sicherstellen.
      - name: Android-SDK vorbereiten
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Capacitor-Android-Projekt synchronisieren
        run: npx cap sync android

      # Beim Hochladen über die GitHub-Webseite verliert gradlew manchmal das Ausführungsrecht.
      - name: Gradle ausführbar machen
        run: chmod +x android/gradlew

      - name: Test-APK bauen (direkt installierbar)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Test-APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Fahrtenplan-Test-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload-Schlüssel bereitstellen
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          FP_UPLOAD_KEYSTORE_BASE64: ${{ secrets.FP_UPLOAD_KEYSTORE_BASE64 }}
        run: printf '%s' "$FP_UPLOAD_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: App-Bundle für den Play Store bauen (signiert)
        if: env.HAS_UPLOAD_KEY == 'true'
        working-directory: android
        env:
          FP_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          RAW_STORE_PW: ${{ secrets.FP_KEYSTORE_PASSWORD }}
        run: |
          # Werte bereinigen (Leerzeichen, Zeilenumbrüche, versehentlich mitkopiertes «Wert:»)
          clean() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^ *Wert: *//' -e 's/^ *//' -e 's/ *$//'; }
          export FP_KEYSTORE_PASSWORD="$(clean "$RAW_STORE_PW")"
          # PKCS12-Schlüsseldatei: Schlüssel-Passwort = Datei-Passwort
          export FP_KEY_PASSWORD="$FP_KEYSTORE_PASSWORD"
          # Name des Schlüssels in der Schlüsseldatei (kein Geheimnis)
          export FP_KEY_ALIAS="fahrtenplan-upload"
          echo "Schlüssel in der Datei:"; keytool -list -keystore "$FP_KEYSTORE_PATH" -storepass "$FP_KEYSTORE_PASSWORD" | grep -i "entry" || true
          ./gradlew bundleRelease --no-daemon

      - name: App-Bundle bereitstellen
        if: env.HAS_UPLOAD_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Fahrtenplan-PlayStore
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Hinweis, falls kein Upload-Schlüssel hinterlegt ist
        if: env.HAS_UPLOAD_KEY != 'true'
        run: echo "::warning::Kein Upload-Schlüssel hinterlegt – es wurde nur die Test-APK gebaut. Für den Play Store die 4 Secrets anlegen (siehe ANLEITUNG-PLAYSTORE.md)."

      - name: Schlüssel-Datei entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
